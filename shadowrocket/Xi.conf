# 玺 - Shadowrocket 自定义分组配置
# 规则在线更新；节点由 Shadowrocket 现有订阅提供

[General]
bypass-system = true
dns-server = https://doh.pub/dns-query,https://dns.alidns.com/dns-query,223.5.5.5,119.29.29.29
fallback-dns-server = system
ipv6 = false
prefer-ipv6 = false
icmp-auto-reply = true
private-ip-answer = true
dns-direct-fallback-proxy = true
hijack-dns = 8.8.8.8:53,8.8.4.4:53
udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true
block-quic = all-proxy

[Proxy]
# 留空：节点继续由 Shadowrocket 里的订阅动态更新

[Proxy Group]

# 主入口：默认第一项就是 ISP 落地
🚀 主节点 = select,🔗 ISP落地,🏗️ 搬瓦工,⚡ 自动优选,🚀 手动选择,🇯🇵 日本直出,DIRECT

# 手动选择：过滤流量/到期/探针类伪节点
🚀 手动选择 = select,policy-regex-filter=^((?!(流量|剩余|已用|总额|到期|探针|重置|主用：|备用：)).)*$

# 普通节点自动测速，不包含链式落地
⚡ 自动优选 = url-test,policy-regex-filter=^(?!.*(链式落地|落地-SOCKS5|落地-HTTP|流量|剩余|已用|总额|到期|探针|重置)).*(搬瓦工|VMISS).*$,url=http://www.gstatic.com/generate_204,interval=300,timeout=5,tolerance=50

# 搬瓦工专用：AI 默认走这里
🏗️ 搬瓦工 = url-test,policy-regex-filter=^(?!.*(链式落地|落地-SOCKS5|落地-HTTP|流量|剩余|已用|总额|到期|探针|重置)).*搬瓦工.*$,url=http://www.gstatic.com/generate_204,interval=300,timeout=5,tolerance=50

# 日本直出节点
🇯🇵 日本直出 = select,policy-regex-filter=(搬瓦工-日本|VMISS-日本)

# ISP / 链式落地：主节点和 Claude 默认走这里
🔗 ISP落地 = fallback,policy-regex-filter=(链式落地|落地-SOCKS5|落地-HTTP),url=http://www.gstatic.com/generate_204,interval=300,timeout=5,tolerance=50

# AI 策略
🤖 Claude = select,🔗 ISP落地,🏗️ 搬瓦工,⚡ 自动优选,🚀 手动选择
🧠 OpenAI = select,🏗️ 搬瓦工,⚡ 自动优选,🔗 ISP落地,🚀 手动选择
✨ Gemini = select,🏗️ 搬瓦工,⚡ 自动优选,🔗 ISP落地,🚀 手动选择
🤖 其他AI = select,🏗️ 搬瓦工,⚡ 自动优选,🔗 ISP落地,🚀 手动选择

# 常用服务
🎬 流媒体 = select,⚡ 自动优选,🇯🇵 日本直出,🚀 主节点,🚀 手动选择
💬 Telegram = select,⚡ 自动优选,🇯🇵 日本直出,🚀 主节点
🐙 GitHub = select,⚡ 自动优选,🇯🇵 日本直出,🚀 主节点,DIRECT
🍎 Apple = select,DIRECT,🚀 主节点,⚡ 自动优选
🪟 Microsoft = select,DIRECT,🚀 主节点,⚡ 自动优选
🎮 游戏 = select,DIRECT,⚡ 自动优选,🇯🇵 日本直出,🚀 主节点

[Rule]

